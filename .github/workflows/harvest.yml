name: Daily Harvest

on:
  schedule:
    # Run at 01:15 UTC every Tue-Sat (After US Post-Market Close 20:00 ET previous day)
    - cron: '15 1 * * 2-6'
  workflow_dispatch:  # Allow manual trigger

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Harvest CLI
      env:
        TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        CAPITAL_X_CAP_API_KEY: ${{ secrets.CAPITAL_X_CAP_API_KEY }}
        CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
        CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      run: |
        python harvest_cli.py