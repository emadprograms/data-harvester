name: Daily Harvest

on:
  schedule:
    # Run at 02:00 UTC (5:00 AM Bahrain) on Tuesday-Saturday
    # This captures the full market session for the day that just ended (Mon-Fri).
    - cron: '0 2 * * 2-6'
  workflow_dispatch:  # Allow manual trigger

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        PYTHONPATH=. python3 -m pytest tests/ -v

    - name: Run Harvest CLI
      env:
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      run: |
        python harvest_cli.py

    - name: Upload Local Database Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: harvest-database
        path: local_market_data.db
        retention-days: 90