name: Daily Harvest

on:
  schedule:
    # Run twice daily at 4:05 AM and 4:05 PM Bahrain (AST) time.
    # This ensures we stay within Capital.com's 16-hour 1-minute data window.
    - cron: '05 01 * * *'  # 4:05 AM Bahrain (Final Session Harvest)
    - cron: '05 13 * * *'  # 4:05 PM Bahrain (Pre-Market Session Harvest)
  workflow_dispatch:  # Allow manual trigger

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        PYTHONPATH=. python3 -m pytest tests/ -v

    - name: Run Harvest CLI
      env:
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      run: |
        python harvest_cli.py