name: Market Session Harvest

on:
  schedule:
    # --- ACTIVE SESSION RUNS (4 times per day) ---
    # These cover the 24h Capital.com window in 6-hour increments.
    # 01:00, 07:00, 13:00, 19:00 UTC
    - cron: '0 01,07,13,19 * * *'
    
    # --- COMPLETED SESSION RUNS (2 times per day) ---
    # 1 hour after close: 02:00 UTC (Targeting Yesterday's session)
    # 5 hours after close: 06:00 UTC (Targeting Yesterday's session)
    - cron: '0 02,06 * * *'

  workflow_dispatch:
    inputs:
      target_date:
        description: 'Manual Session Date (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        PYTHONPATH=. python -m pytest tests/

    - name: Run Active Harvest
      if: github.event.schedule == '0 01,07,13,19 * * *' || github.event_name == 'workflow_dispatch'
      env:
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      run: |
        if [ -n "${{ github.event.inputs.target_date }}" ]; then
          python main.py --date "${{ github.event.inputs.target_date }}"
        else
          python main.py
        fi

    - name: Run Completed Harvest (Yesterday)
      if: github.event.schedule == '0 02,06 * * *'
      env:
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      run: |
        # Calculate YYYY-MM-DD for yesterday
        YESTERDAY=$(date -d "yesterday" '+%Y-%m-%d')
        echo "Running harvest for completed session: $YESTERDAY"
        python main.py --date "$YESTERDAY"
