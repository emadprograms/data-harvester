name: Daily Harvest

on:
  schedule:
    # Run 1: 21:15 UTC (~16:15 ET) -> Harvest "Today" (Pre + Regular, right after close)
    # Run 2: 08:30 UTC (~03:30 ET) -> Harvest "Yesterday" (Post, before next Pre-Market)
    - cron: '15 21 * * 1-5' # Mon-Fri (Market Open Days)
    - cron: '30 8 * * 2-6'  # Tue-Sat (Morning after trading days)
  workflow_dispatch:  # Allow manual trigger

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Harvest CLI
      env:
        TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        CAPITAL_X_CAP_API_KEY: ${{ secrets.CAPITAL_X_CAP_API_KEY }}
        CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
        CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      run: |
        python harvest_cli.py